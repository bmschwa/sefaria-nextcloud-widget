name: Validate and release app

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: composer

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Lint PHP
        run: composer lint

      - name: Install XML lint tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils

      - name: Validate app metadata
        run: xmllint --noout appinfo/info.xml

  release:
    name: Build and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          release_tag="main-${GITHUB_SHA:0:12}"
          nightly=true
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      - name: Fetch Sefaria app logo
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output appinfo/icon.png \
            https://files.readme.io/87c5652-image.png
          test -s appinfo/icon.png

      - name: Build App Store archive
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          staging="${RUNNER_TEMP}/sefaria_dashboard"
          archive="sefaria_dashboard-${version}.tar.gz"
          mkdir -p "$staging"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.vscode' --exclude='vendor' ./ "$staging/"
          tar -czf "$archive" -C "${RUNNER_TEMP}" sefaria_dashboard
          tar -tzf "$archive"
          test "$(tar -tzf "$archive" | sed -n '1p')" = "sefaria_dashboard/"
          test -f "$staging/appinfo/info.xml"
          test -f "$staging/CHANGELOG.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          prerelease: ${{ steps.version.outputs.nightly }}
          generate_release_notes: true
          files: sefaria_dashboard-${{ steps.version.outputs.version }}.tar.gz

      - name: Publish app to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@v1.0.5
        with:
          app_name: sefaria_dashboard
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.release_tag }}/sefaria_dashboard-${{ steps.version.outputs.version }}.tar.gz
          nightly: ${{ steps.version.outputs.nightly }}